<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentina · Asesora de maquillaje</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a8325a' d='M9.6 9.5V5.6c0-.6.3-1.1.8-1.5l2.9-2.2c.6-.4 1.3 0 1.3.7v6.9z'/%3E%3Crect x='8.6' y='9.5' width='7.8' height='3.6' rx='.8' fill='%23b9a3b8'/%3E%3Crect x='7.8' y='13.1' width='9.4' height='8.6' rx='1.4' fill='%23f6eef4'/%3E%3C/svg%3E">
  <script>
    // Aplica el tema ANTES de pintar para evitar el parpadeo al cargar
    (function () {
      var tema = 'oscuro';
      try {
        tema = localStorage.getItem('tema') ||
          (window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro');
      } catch (e) {}
      document.documentElement.setAttribute('data-tema', tema);
      try {
        if (localStorage.getItem('publicidad') === '0') {
          document.documentElement.classList.add('sin-publicidad');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app menu-oculto" id="app">

    <!-- Publicidad decorativa de fondo: bandas con movimiento (las genera script.js) -->
    <div class="fondo-publicidad" id="fondo-publicidad" aria-hidden="true">
      <div class="publicidad-giro" id="publicidad-giro"></div>
    </div>

    <!-- Barra lateral: configuración de la clave de Alibaba Cloud (Model Studio) -->
    <aside class="sidebar" id="sidebar" aria-label="Configuración">
      <h2>Configuración</h2>

      <form id="form-clave" class="clave-form" autocomplete="off">
        <label for="input-clave">Clave de Alibaba Cloud (Model Studio)</label>
        <input type="password" id="input-clave" placeholder="Pega tu clave API (sk-...) aquí" autocomplete="off">
        <div class="clave-botones">
          <button type="submit" class="btn-primario">Guardar</button>
          <button type="button" id="btn-borrar-clave" class="btn-secundario">Borrar clave</button>
        </div>
      </form>

      <p id="aviso-clave" class="aviso" role="status"></p>
    </aside>

    <div class="contenido">

      <!-- Barra superior: logo y botones -->
      <header class="topbar">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path class="labial-punta" d="M9.6 9.5V5.6c0-.6.3-1.1.8-1.5l2.9-2.2c.6-.4 1.3 0 1.3.7v6.9z"/>
            <rect class="labial-collar" x="8.6" y="9.5" width="7.8" height="3.6" rx=".8"/>
            <rect class="labial-base" x="7.8" y="13.1" width="9.4" height="8.6" rx="1.4"/>
            <rect x="9.4" y="14.6" width="1.2" height="5.6" rx=".6" fill="#fff" opacity=".25"/>
          </svg>
        </div>
        <button id="btn-sidebar" class="btn-icono" aria-label="Mostrar u ocultar barra lateral" aria-controls="sidebar" aria-expanded="false">☰</button>
        <button id="btn-nuevo" class="btn-icono" aria-label="Nuevo chat">+</button>
        <button id="btn-publicidad" class="btn-icono" type="button" aria-label="Ocultar publicidad de fondo" title="Ocultar publicidad de fondo">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="6" width="18" height="12" rx="2"/>
              <path d="M7 12h6"/>
              <path class="icono-tachado" d="M4 4l16 16"/>
            </g>
          </svg>
        </button>
        <button id="btn-tema" class="btn-icono" type="button" aria-label="Cambiar a modo claro" title="Cambiar a modo claro">
          <svg class="icono-sol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </g>
          </svg>
          <svg class="icono-luna" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </header>

      <!-- Zona de conversación -->
      <main class="chat" id="chat">
        <section class="bienvenida" id="bienvenida">
          <div class="logo logo-grande" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="44" height="44">
              <path class="labial-punta" d="M9.6 9.5V5.6c0-.6.3-1.1.8-1.5l2.9-2.2c.6-.4 1.3 0 1.3.7v6.9z"/>
              <rect class="labial-collar" x="8.6" y="9.5" width="7.8" height="3.6" rx=".8"/>
              <rect class="labial-base" x="7.8" y="13.1" width="9.4" height="8.6" rx="1.4"/>
              <rect x="9.4" y="14.6" width="1.2" height="5.6" rx=".6" fill="#fff" opacity=".25"/>
            </svg>
          </div>
          <h1>Hola, soy Valentina. ¿Qué look buscas hoy?</h1>
        </section>
        <div class="mensajes" id="mensajes"></div>
      </main>

      <!-- Cuadro de entrada -->
      <footer class="pie">
        <form id="form-chat" class="entrada">
          <label for="mensaje" class="sr-only">Escribe tu mensaje</label>
          <textarea id="mensaje" rows="1" placeholder="Mensaje al asistente de maquillaje"></textarea>

          <div class="entrada-barra">
            <div class="chips">
              <!-- "Pensamiento Profundo" activa el modelo de razonamiento; "Búsqueda inteligente" es decorativa -->
              <button type="button" id="btn-pensamiento" class="chip" aria-pressed="false" title="Modo razonamiento profundo: respuestas más elaboradas, pero tarda más en empezar">Pensamiento Profundo</button>
              <span class="chip chip-acento">Búsqueda inteligente</span>
            </div>

            <div class="entrada-acciones">
              <button type="button" class="btn-icono" aria-label="Adjuntar archivo (no disponible)">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3L16 6.5"/>
                </svg>
              </button>
              <button type="submit" id="btn-enviar" class="btn-enviar" aria-label="Enviar mensaje">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
              </button>
            </div>
          </div>
        </form>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
